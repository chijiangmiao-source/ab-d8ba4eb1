services:
  # 光学参数发布页及接口（React 构建产物由 Express 一并托管）
  app:
    build: .
    image: optical-bench-release
    environment:
      PORT: "8080"
      DATA_DIR: /data
    ports:
      # 宿主端口可通过 .env / 环境变量 HOST_PORT 配置，默认 8080
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - release-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 验收服务：代码测试 + 构建检查 + API 冒烟（回执补记、重复发布、冲突）
  # 用法： docker compose up --exit-code-from verify verify
  # 结束后退出，退出码即验收结论（0 全部通过）
  verify:
    image: optical-bench-release
    build: .
    environment:
      BASE_URL: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["node"]
    command: ["scripts/verify.mjs"]
    restart: "no"

volumes:
  release-data:
